name: Scheduled SeaTalk Reminder

on:
  # 1. Mengizinkan trigger otomatis dari cron-job.org via API Webhook
  repository_dispatch:
    types:
      - trigger_reminder1
      - trigger_reminder2
      - trigger_reminder3
      - trigger_reminder4

  # 2. Tetap mempertahankan trigger manual dari halaman GitHub Actions UI (Dropdown)
  workflow_dispatch:
    inputs:
      reminder_type:
        description: 'Pilih jenis reminder yang ingin dikirim:'
        required: true
        default: 'sop'
        type: choice
        options:
          - sop
          - absen
          - strategi
          - flow_call

jobs:
  trigger-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the repository files to the runner environment
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Logika penentuan pesan berdasarkan pemicu (UI Manual / cron-job.org)
    - name: Run Reminder Script
      env:
        SEATALK_WEBHOOK_URL: ${{ secrets.SEATALK_WEBHOOK_URL }}
      run: |
        # 1. Cek apakah dipicu lewat cron-job.org (repository_dispatch)
        if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          EVENT_TYPE="${{ github.event.action }}"
          if [ "$EVENT_TYPE" = "trigger_reminder1" ]; then
            REMINDER="sop"
          elif [ "$EVENT_TYPE" = "trigger_reminder2" ]; then
            REMINDER="absen"
          elif [ "$EVENT_TYPE" = "trigger_reminder3" ]; then
            REMINDER="strategi"
          elif [ "$EVENT_TYPE" = "trigger_reminder4" ]; then
            REMINDER="flow_call"
          fi
        # 2. Cek apakah dipicu lewat tombol UI manual (workflow_dispatch)
        else
          REMINDER="${{ github.event.inputs.reminder_type }}"
          if [ -z "$REMINDER" ]; then
            REMINDER="sop"
          fi
        fi

        echo "Mengeksekusi parameter script: python send_reminder.py $REMINDER"
        python send_reminder.py $REMINDER
